trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - pwsh: |
      Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
      Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
      Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
    displayName: Install test tools

  - pwsh: |
      $findings = Invoke-ScriptAnalyzer -Path ./src -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
      $findings | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize
      if ($findings) { throw "PSScriptAnalyzer found $(@($findings).Count) issue(s)" }
    displayName: PSScriptAnalyzer

  - pwsh: |
      $config = New-PesterConfiguration
      $config.Run.Path = './tests'
      $config.Run.Exit = $true
      $config.TestResult.Enabled = $true
      $config.TestResult.OutputFormat = 'NUnitXml'
      $config.TestResult.OutputPath = 'test-results.xml'
      $config.Output.Verbosity = 'Detailed'
      Invoke-Pester -Configuration $config
    displayName: Pester

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: NUnit
      testResultsFiles: '**/test-results.xml'
      failTaskOnFailedTests: true
